name: Build

on:
  schedule:
    - cron: '0 10 10 * *'
  push:
  pull_request_target:
    types: [labeled]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      artifactVersion: ${{ steps.setversion.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 #v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Ensure to use tagged version
        run: ./mvnw versions:set --file ./pom.xml -DnewVersion=${GITHUB_REF##*/} # use shell parameter expansion to strip of 'refs/tags'
        if: startsWith(github.ref, 'refs/tags/')
      - name: Output project version
        id: setversion
        run: |
          BUILD_VERSION=$(./mvnw help:evaluate "-Dexpression=project.version" -q -DforceStdout)
          echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and Test
        run: ./mvnw -B install
      - name: Upload artifact cryptomator-cli-${{ steps.setversion.outputs.version }}.jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptomator-cli-${{ steps.setversion.outputs.version }}.jar
          path: target/cryptomator-cli-*.jar
      - name: Build app image and run integration tests
        run: ./build_linux.sh