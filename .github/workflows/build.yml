name: Build

on:
  schedule:
    - cron: '0 10 10 * *'
  push:
  pull_request:

jobs:
  build-plain:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 #v4.8.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build and Test
        run: ./mvnw -B verify