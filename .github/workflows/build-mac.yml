name: Java app image macOS

on:
  schedule:
    - cron: '0 10 10 * *'
  workflow_call:
    inputs:
      semVerNum:
        type: string
        description: 'The Major.Minor.Patch part of the version'
        required: true
      revisionNum:
        type: string
        description: 'The revision number'
        required: true
      semVerSuffix:
        type: string
        description: 'The suffix of the version, including dash'
        required: true
      notarize:
        type: boolean
        description: 'Notarize app'
        default: true
      upload-to-draft:
        type: boolean
        default: true
    outputs:
      sha256-mac-zip-arm64:
        description: "SHA256 sum of the arm64 zip"
        value: ${{ jobs.collect-sha256sums.outputs.arm64-sha256sum}}
      sha256-mac-zip-x64:
        description: "SHA256 sum of the x64 zip"
        value: ${{ jobs.collect-sha256sums.outputs.x64-sha256sum}}
  workflow_dispatch:
    inputs:
      semVerNum:
        description: 'The Major.Minor.Patch part of the version'
        required: false
      revisionNum:
        description: 'The revision number'
        required: false
      semVerSuffix:
        description: 'The suffix of the version, including dash'
        required: false
        default: '-SNAPSHOT'
      notarize:
        description: 'Notarize app'
        required: false
        type: boolean

permissions:
  contents: write

env:
  JAVA_DIST: 'zulu'
  JAVA_VERSION: '24.0.0+36'
  VERSION_NUM: ${{ inputs.semVerNum || '99.99.99' }}
  REVISION_NUM: ${{ inputs.revisionNum || '0' }}
  VERSION_SUFFIX: ${{ inputs.semVerSuffix || '' }}

defaults:
  run:
    shell: bash

jobs:
  build-binary:
    name: Build java app image
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            xcode-path: /Applications/Xcode_26.6.app
          - os: macos-15-intel
            architecture: x64
            xcode-path: /Applications/Xcode_16.app
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_NAME: cryptomator-cli-${{ inputs.semVerNum || '99.99.99' }}${{ inputs.semVerSuffix || '' }}-mac-${{ matrix.architecture }}.zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 #v4.8.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
      - name: Set version
        run: ./mvnw versions:set -DnewVersion="${VERSION_NUM}${VERSION_SUFFIX}"
      - name: Run maven
        run: ./mvnw -B clean package -DskipTests
      - name: Patch target dir
        run: |
          cp target/cryptomator-*.jar target/mods
      - name: Run jlink
        run: |
          envsubst < dist/jlink.args > target/jlink.args
          "${JAVA_HOME}/bin/jlink" '@./target/jlink.args'
      - name: Run jpackage
        run: |
          envsubst < dist/jpackage.args > target/jpackage.args
          "${JAVA_HOME}/bin/jpackage" '@./target/jpackage.args'
        env:
          JP_APP_VERSION: '1.0.0' # see https://github.com/cryptomator/cli/issues/72
          APP_VERSION: ${{ env.VERSION_NUM }}${{ env.VERSION_SUFFIX }}
          NATIVE_ACCESS_PACKAGE: org.cryptomator.jfuse.mac
      - name: Patch .app dir
        run: |
          cp ../LICENSE.txt cryptomator-cli.app/Contents
          cp cryptomator-cli_completion.sh cryptomator-cli.app/Contents
          sed -i '' "s|###BUNDLE_SHORT_VERSION_STRING###|${VERSION_NUM}|g" cryptomator-cli.app/Contents/Info.plist
          sed -i '' "s|###BUNDLE_VERSION###|${REVISION_NUM}|g" cryptomator-cli.app/Contents/Info.plist
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "cryptomator-cli.app/Contents/embedded.provisionprofile"
        working-directory: target
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
      - name: Install codesign certificate
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/codesign.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/codesign.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$CODESIGN_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$CODESIGN_TMP_KEYCHAIN_PW" $KEYCHAIN_PATH
          security set-keychain-settings -lut 900 $KEYCHAIN_PATH
          security unlock-keychain -p "$CODESIGN_TMP_KEYCHAIN_PW" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$CODESIGN_P12_PW" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
        env:
          CODESIGN_P12_BASE64: ${{ secrets.MACOS_CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PW: ${{ secrets.MACOS_CODESIGN_P12_PW }}
          CODESIGN_TMP_KEYCHAIN_PW: ${{ secrets.MACOS_CODESIGN_TMP_KEYCHAIN_PW }}
      - name: Codesign
        run: |
          echo "Codesigning jdk files..."
          find cryptomator-cli.app/Contents/runtime/Contents/Home/lib/ -name '*.dylib' -exec codesign --force -s ${CODESIGN_IDENTITY} {} \;
          find cryptomator-cli.app/Contents/runtime/Contents/Home/lib/ \( -name 'jspawnhelper' -o -name 'pauseengine' -o -name 'simengine' \) -exec codesign --force -o runtime -s ${CODESIGN_IDENTITY} {} \;
          echo "Codesigning jar contents..."
          find cryptomator-cli.app/Contents/runtime/Contents/MacOS -name '*.dylib' -exec codesign --force -s ${CODESIGN_IDENTITY} {} \;
          for JAR_PATH in `find cryptomator-cli.app -name "*.jar"`; do
            if [[ `unzip -l ${JAR_PATH} | grep '.dylib\|.jnilib'` ]]; then
              JAR_FILENAME=$(basename ${JAR_PATH})
              OUTPUT_PATH=${JAR_PATH%.*}
              echo "Codesigning libs in ${JAR_FILENAME}..."
              unzip -q ${JAR_PATH} -d ${OUTPUT_PATH}
              find ${OUTPUT_PATH} -name '*.dylib' -exec codesign --force -s ${CODESIGN_IDENTITY} {} \;
              find ${OUTPUT_PATH} -name '*.jnilib' -exec codesign --force -s ${CODESIGN_IDENTITY} {} \;
              rm ${JAR_PATH}
              pushd ${OUTPUT_PATH} > /dev/null
              zip -qr ../${JAR_FILENAME} *
              popd > /dev/null
              rm -r ${OUTPUT_PATH}
            fi
          done
          echo "Codesigning Cryptomator-cli.app..."
          sed -i '' "s|###APP_IDENTIFIER_PREFIX###|${TEAM_IDENTIFIER}.|g" ../dist/mac/cryptomator-cli.entitlements
          sed -i '' "s|###TEAM_IDENTIFIER###|${TEAM_IDENTIFIER}|g" ../dist/mac/cryptomator-cli.entitlements
          codesign --force --deep --entitlements ../dist/mac/cryptomator-cli.entitlements -o runtime -s ${CODESIGN_IDENTITY} cryptomator-cli.app
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          TEAM_IDENTIFIER: ${{ secrets.MACOS_TEAM_IDENTIFIER }}
        working-directory: target
        # ditto must be used, see https://developer.apple.com/documentation/xcode/packaging-mac-software-for-distribution#Build-a-zip-archive
      - name: Zip binary for notarization
        if: inputs.notarize || github.event_name == 'schedule'
        run: ditto -c -k --keepParent ./target/cryptomator-cli.app "./${ARTIFACT_NAME}"
      - name: Setup Xcode
        if: inputs.notarize || github.event_name == 'schedule'
        run: sudo xcode-select -s ${{ matrix.xcode-path}}
        shell: bash
        #would like to uses cocoalibs/xcode-notarization-action@v1, but blocked due to https://github.com/cocoalibs/xcode-notarization-action/issues/1
      - name: Prepare Notarization Credentials
        if: inputs.notarize || github.event_name == 'schedule'
        run: |
          # create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/notarization.keychain-db
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "${KEYCHAIN_PASS}" ${KEYCHAIN_PATH}
          security set-keychain-settings -lut 900 ${KEYCHAIN_PATH}
          security unlock-keychain -p "${KEYCHAIN_PASS}" ${KEYCHAIN_PATH}
          # import credentials from secrets
          xcrun notarytool store-credentials "notary" --apple-id "${APPLE_ID}" --password "${NOTARIZATION_PW}" --team-id "${TEAM_ID}" --keychain "${KEYCHAIN_PATH}"
        env:
          APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          NOTARIZATION_PW: ${{ secrets.MACOS_NOTARIZATION_PW }}
        shell: bash
      - name: Notarize
        if: inputs.notarize || github.event_name == 'schedule'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/notarization.keychain-db
          xcrun notarytool submit "${ARTIFACT_NAME}" --keychain-profile "notary" --keychain "${KEYCHAIN_PATH}" --wait
        shell: bash
      - name: Staple
        if: inputs.notarize || github.event_name == 'schedule'
        run: xcrun stapler staple ./target/cryptomator-cli.app
        shell: bash
      - name: Cleanup
        if: ${{ always() }}
        run: |
          rm -f "./${ARTIFACT_NAME}"
          security delete-keychain $RUNNER_TEMP/notarization.keychain-db
        shell: bash
        continue-on-error: true
      - name: Zip app for distribution
        run: ditto -c -k --keepParent ./target/cryptomator-cli.app "./${ARTIFACT_NAME}"
      - name: Create detached GPG signature with key 615D449FE6E6A235
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --quiet --import
          echo "${GPG_PASSPHRASE}" | gpg --batch --quiet --passphrase-fd 0 --pinentry-mode loopback -u 615D449FE6E6A235 --detach-sign -a "./${ARTIFACT_NAME}"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASES_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASES_GPG_PASSPHRASE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cryptomator-cli-mac-${{ matrix.architecture }}
          path: |
            ${{ env.ARTIFACT_NAME}}
            *.asc
          if-no-files-found: error
      - name: Publish zip on GitHub Releases
        if: inputs.upload-to-draft
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: true
          fail_on_unmatched_files: true
          token: ${{ secrets.CRYPTOBOT_RELEASE_TOKEN }}
          files: |
            ${{ env.ARTIFACT_NAME }}
            cryptomator-*.asc

  collect-sha256sums:
    name: Collect app image checksums
    runs-on: ubuntu-latest
    needs: [build-binary]
    if: inputs.upload-to-draft
    outputs:
      arm64-sha256sum: ${{ steps.sha256sum.outputs.arm64-sha256sum }}
      x64-sha256sum: ${{ steps.sha256sum.outputs.x64-sha256sum }}
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cryptomator-cli-mac-*
          path: clis
      - name: Compute SHA256 sums
        id: sha256sum
        run: |
          read -ra ARM64_SUM < <(sha256sum clis/cryptomator-cli-mac-arm64/cryptomator-cli-*-arm64.zip)
          read -ra X64_SUM < <(sha256sum clis/cryptomator-cli-mac-x64/cryptomator-cli-*-x64.zip)
          echo "arm64-sha256sum=${ARM64_SUM[0]}" >> "$GITHUB_OUTPUT"
          echo "x64-sha256sum=${X64_SUM[0]}" >> "$GITHUB_OUTPUT"
